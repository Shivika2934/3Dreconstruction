services:
  - type: web
    name: reconstruction-dashboard
    env: python
    buildCommand: pip install -r gradio_requirements.txt
    startCommand: python gradio_dashboard.py
    envVars:
      - key: PORT
        value: 10000
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
      - key: GRADIO_SERVER_PORT
        value: 10000
